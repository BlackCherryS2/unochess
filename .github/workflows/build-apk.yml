name: Build UNO CHESS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/com/unochess/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/unochess/game/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp styles.xml app/src/main/res/values/styles.xml

      - name: Create app Gradle file
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.unochess.game"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.unochess.game"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "0.3.0"
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNO-CHESS-v0.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
