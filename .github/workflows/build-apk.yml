name: Build UNO CHESS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # -------------------------------------------------------
      # 1. UNO CHESS ZIP 자동 탐색 + 압축 해제
      # -------------------------------------------------------
      - name: Extract UNO CHESS source
        run: |
          echo "=== UNO CHESS SOURCE PACK ==="

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "UNO-CHESS*.zip" \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: UNO CHESS ZIP file not found."
            exit 1
          fi

          echo "Using source:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -type f -print

      # -------------------------------------------------------
      # 2. 필요한 파일 자동 검색
      # -------------------------------------------------------
      - name: Find UNO CHESS source files
        run: |
          MANIFEST=$(find extracted -type f \
            -name "AndroidManifest.xml" | head -n 1)

          ACTIVITY=$(find extracted -type f \
            -name "MainActivity.java" | head -n 1)

          INDEX=$(find extracted -type f \
            -name "index.html" | head -n 1)

          STYLES=$(find extracted -type f \
            -name "styles.xml" | head -n 1)

          ICON=$(find extracted -type f \
            -name "app_icon.png" | head -n 1)

          echo "Manifest : $MANIFEST"
          echo "Activity : $ACTIVITY"
          echo "HTML     : $INDEX"
          echo "Styles   : $STYLES"
          echo "Icon     : $ICON"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if [ -z "$ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          if [ -z "$STYLES" ]; then
            echo "ERROR: styles.xml not found."
            exit 1
          fi

          if [ -z "$ICON" ]; then
            echo "ERROR: app_icon.png not found."
            exit 1
          fi

          # Android
